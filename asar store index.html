<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>https://asar-store.github.io/n</title>
    <style>
        :root { color-scheme: dark; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
            background: #0d1117;
            color: #c9d1d9;
        }
        h1, h2, h3 { color: #58a6ff; }
        a { color: #58a6ff; }
        code, .mono {
            background: #161b22;
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        pre {
            background: #161b22;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85em;
        }
        .warning {
            background: #3d1ele;
            border-left: 4px solid #f85149;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 4px;
        }
        .info {
            background: #1c2a3a;
            border-left: 4px solid #58a6ff;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 4px;
        }

<body>
    <h1>Asar Store Host</h1>

    <div class="info">
